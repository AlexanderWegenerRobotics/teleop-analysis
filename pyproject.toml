[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "teleop-analysis"
version = "0.1.0"
description = "Time-synchronised viewer and loaders for the teleoperation logs"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "PySide6>=6.5",
    "pyqtgraph>=0.13.3",
    "matplotlib",
    "opencv-python",
    "h5py",
    "av",
    "pyyaml", "qtawesome>=1.3",
]

[project.optional-dependencies]
ros = ["rosbags>=0.10"]

[project.scripts]
teleop-analysis = "teleop_analysis.viewer.app:main"
teleop-collect = "teleop_analysis.collect:main"
teleop-attention = "teleop_analysis.attention:main"
teleop-analysis-shortcut = "teleop_analysis.shortcut:main"

[project.gui-scripts]
teleop-analysis-gui = "teleop_analysis.viewer.app:main"

[tool.setuptools.package-data]
teleop_analysis = ["assets/*.ico"]

[tool.setuptools.packages.find]
include = ["teleop_analysis*"]
